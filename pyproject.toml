[project]
name = "pudding"
version = "0.0.0"
description = "Maths-reasoning LLMs on Modal: a TIR solver (the spine) and a Lean prover extension, sharing one model-server/executor-or-verifier/orchestrator skeleton."
requires-python = ">=3.11"
dependencies = [
    "modal>=0.64",
    "openai>=1.0",
    "jupyter_client",  # local IPython kernel = the solver's executor
    "ipykernel",       # the kernel the solver runs code in
    "sympy",           # the libs model-written code reaches for
    "numpy",
    "scipy",
    "math-verify",     # symbolic equivalence grading for MATH-500 (LaTeX answers)
    "datasets",        # HF benchmark loaders (GSM8K, MATH-500, AMC, AIME)
    "fastapi",         # the OpenAI-compatible chat shim (shim.py → Open WebUI)
    "uvicorn",
    # "kimina-client",   # client for the Kimina Lean Server = the prover's verifier
]

# Optional consumers — the core `pudding` library has ZERO frontend deps (STUDIO_PLAN §2); the
# studio is opt-in. Install with: uv run --extra studio …  (or `pip install pudding[studio]`).
[project.optional-dependencies]
studio = [
    "marimo",          # the reactive notebook surface (studio/app.py) — imports pudding, not vice versa
]

# Versions are starting guesses — see PLAN.md. Nothing here has been run yet.
